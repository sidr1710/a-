<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Corm;src:url(assets/CormorantGaramond-600-normal.woff2);font-weight:600}
@font-face{font-family:Corm;src:url(assets/CormorantGaramond-700-normal.woff2);font-weight:700}
@font-face{font-family:Corm;src:url(assets/CormorantGaramond-500-italic.woff2);font-weight:500;font-style:italic}
@font-face{font-family:Script;src:url(assets/Playball-400-normal.woff2)}
@font-face{font-family:Mont;src:url(assets/Montserrat-400-normal.woff2);font-weight:400}
@font-face{font-family:Mont;src:url(assets/Montserrat-600-normal.woff2);font-weight:600}
:root{--cream:#f7f0e7;--ink:#1d2550;--pink:#c8216b;--gold:#b8925a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--cream)}
.ad{position:relative;width:1080px;height:1350px;background:radial-gradient(ellipse at 50% 45%,#fbf6ef 0%,var(--cream) 60%,#f1e6d8 100%);font-family:Mont,sans-serif;color:var(--ink);text-align:center}
.top{padding-top:58px}
.logo{font-family:Script;font-size:66px;color:var(--pink);line-height:1}
.logo sup{font-family:Mont;font-size:18px;vertical-align:top;position:relative;top:6px}
.sub{margin-top:12px;font-weight:600;font-size:15px;letter-spacing:6px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:16px}
.sub i{display:block;height:2px;width:44px;background:var(--pink)}
h1{margin-top:40px;font-family:Corm;font-weight:700;font-size:66px;line-height:1.02}
h1 em{display:block;font-style:italic;font-weight:500;color:var(--pink)}
.duo{margin-top:48px;display:flex;justify-content:center;gap:64px}
.card{width:400px}
.arch{position:relative;width:400px;height:540px;border-radius:200px 200px 18px 18px;overflow:hidden;box-shadow:0 18px 40px rgba(29,37,80,.16);border:6px solid #fff}
.louise{background:radial-gradient(circle at 50% 35%,#fdf3ea,#ead6c4)}
.louise img{position:absolute;width:520px;left:-66px;top:24px}
.kavita{background:url(assets/kavita.jpg) -90px -4px/600px auto no-repeat}
.card b{display:block;margin-top:22px;font-family:Corm;font-weight:700;font-size:40px}
.card span{display:block;margin-top:4px;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--pink);font-weight:600}
.quote{margin:40px auto 0;width:860px;font-family:Corm;font-style:italic;font-weight:500;font-size:31px;line-height:1.25;color:#3a3f5e}
.quote small{font-family:Mont;font-style:normal;font-weight:600;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-left:10px}
.bar{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 72px}
.btn{background:var(--pink);color:#fff;font-weight:600;font-size:23px;letter-spacing:3px;text-transform:uppercase;padding:24px 44px;border-radius:60px}
.url{color:#fff;font-family:Corm;font-weight:600;font-size:44px;text-align:right}
.url small{display:block;font-family:Mont;font-weight:400;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:#c9b38d;margin-bottom:4px}
</style></head><body><div class="ad">
<div class="top">
 <div class="logo">Heal Your Life<sup>®</sup></div>
 <div class="sub"><i></i>Transformational Workshops<i></i></div>
 <h1>Create peace in your mind.<em>Find it in your life.</em></h1>
</div>
<div class="duo">
 <div class="card"><div class="arch louise"><img src="assets/louise-cut.png"></div><b>Louise Hay</b><span>The philosophy</span></div>
 <div class="card"><div class="arch kavita"></div><b>Kavita Munot</b><span>Your facilitator</span></div>
</div>
<div class="quote">“When we create peace and harmony and balance in our minds,<br>we will find it in our lives.”<small>Louise Hay</small></div>
<div class="bar"><div class="btn">Book your seat</div><div class="url"><small>Learn more</small>www.kavitamunot.com</div></div>
</div></body></html>
